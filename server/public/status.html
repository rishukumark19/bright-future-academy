<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status — [COURSE BRAND]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="module" crossorigin src="/assets/status-P_FLbAiy.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/config-DZnAvSjb.js">
  <link rel="stylesheet" crossorigin href="/assets/config-CsUxpk3A.css">
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center">
  <div class="page-container py-space-xl flex flex-col items-center gap-space-xl text-center max-w-lg">

    <!-- Animated status icon -->
    <div id="status-icon-wrap" class="w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center">
      <!-- Spinner while pending -->
      <svg class="animate-spin text-primary-container" id="spinner" width="40" height="40" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.416" stroke-dashoffset="10" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="flex flex-col gap-space-sm">
      <span class="badge-primary mx-auto" id="status-tag">
        <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
        Verifying Payment
      </span>
      <h1 class="font-headline-lg text-headline-lg-mobile text-on-surface" id="status-heading">Processing Your Payment…</h1>
      <p class="font-body-md text-body-md text-on-surface-variant" id="status-sub">
        Please wait while we verify your transaction. Do not close or refresh this window.
      </p>
    </div>

    <!-- Progress bar -->
    <div class="w-full bg-surface-container-high rounded-full h-1.5 overflow-hidden">
      <div class="h-full bg-primary-container rounded-full transition-all duration-500" id="progress-bar" style="width: 10%"></div>
    </div>

    <div class="flex flex-col gap-space-sm items-center">
      <div class="flex items-center gap-space-sm font-label-sm text-label-sm text-on-surface-variant uppercase">
        <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
        <span id="status-step">Contacting payment server…</span>
      </div>
      <p class="font-body-sm text-body-sm text-on-surface-variant" id="order-ref">—</p>
    </div>

    <a id="whatsapp-help" href="#" target="_blank" rel="noopener" class="btn-secondary h-10 px-space-lg text-[13px]">
      <span class="material-symbols-outlined text-[16px]">chat</span>
      Need Help? WhatsApp Support
    </a>
  </div>

</body>
</html>
